<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction R75</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#071426;
  color:white;
  font-family:Arial,sans-serif;
}

.card{
  max-width:600px;
  margin:40px auto;
  padding:25px;
  background:#10233d;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h1{
  margin-top:0;
  color:#00ff88;
}

.status{
  margin:20px 0;
  padding:15px;
  border-radius:12px;
  background:#172d49;
  font-size:18px;
}

.label{
  color:#9fb3c8;
  margin-top:20px;
}

.value{
  font-size:32px;
  font-weight:bold;
  margin-top:8px;
}

.digit{
  font-size:70px;
  color:#00ff88;
}

.warning{
  margin-top:25px;
  color:#ffcc00;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

<h1>Prediction R75</h1>

<div class="status" id="status">
🟠 Connexion...
</div>

<div class="label">
Marché
</div>

<div class="value">
Volatility 75 (R_75)
</div>

<div class="label">
Prix en direct
</div>

<div class="value" id="price">
—
</div>

<div class="label">
Dernier chiffre
</div>

<div class="digit" id="digit">
—
</div>

<div class="warning">
Test de connexion et lecture des ticks uniquement.<br>
Aucun trade n'est envoyé.
</div>

</div>

<script>

const statusEl = document.getElementById("status");
const priceEl = document.getElementById("price");
const digitEl = document.getElementById("digit");

let ws;

function connect(){

  statusEl.textContent = "🟠 Connexion...";

  ws = new WebSocket(
    "wss://ws.derivws.com/websockets/v3?app_id=1089"
  );

  ws.onopen = function(){

    statusEl.textContent = "🟢 Connecté — attente du tick...";

    ws.send(JSON.stringify({
      ticks: "R_75",
      subscribe: 1
    }));
  };

  ws.onmessage = function(event){

    try{

      const data = JSON.parse(event.data);

      if(data.error){
        statusEl.textContent =
          "🔴 Erreur : " + data.error.message;
        return;
      }

      if(data.msg_type === "tick"){

        const quote = Number(data.tick.quote);

        priceEl.textContent = quote.toFixed(
          data.tick.pip_size
        );

        const formatted =
          quote.toFixed(data.tick.pip_size);

        const lastDigit =
          formatted.charAt(formatted.length - 1);

        digitEl.textContent = lastDigit;

        statusEl.textContent =
          "🟢 Connecté — tick reçu";
      }

    }catch(error){

      statusEl.textContent =
        "🔴 Erreur de lecture";
    }
  };

  ws.onerror = function(){

    statusEl.textContent =
      "🔴 Erreur de connexion";
  };

  ws.onclose = function(){

    statusEl.textContent =
      "🔴 Déconnecté";
  };
}

connect();

</script>

</body>
</html>
